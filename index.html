<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A theory about consciousness, self-models, and the future of AI">
    <title>Consciousness Theory - bthavanish</title>
    <style>
        /* === CSS Variables === */
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #e5e5e5;
            --shadow: rgba(0, 0, 0, 0.1);
            --radius: 8px;
        }

        html.dark {
            --bg-primary: #000000;
            --bg-secondary: #0d0d0d;
            --bg-tertiary: #1a1a1a;
            --text-primary: #fafafa;
            --text-secondary: #a6a6a6;
            --text-tertiary: #737373;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --border: #333333;
            --shadow: rgba(255, 255, 255, 0.05);
        }

        /* === Reset & Base === */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* === Header === */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            background-color: rgba(var(--bg-primary-rgb, 250, 250, 250), 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            animation: slideDown 0.4s ease;
        }

        html.dark .site-header {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .header-container {
            max-width: 880px;
            margin: 0 auto;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            animation: fadeIn 0.6s ease 0.2s both;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.6s ease 0.3s both;
        }

        .theme-toggle:hover {
            background-color: var(--bg-secondary);
            transform: scale(1.05);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-icon {
            width: 20px;
            height: 20px;
            stroke: var(--text-primary);
            stroke-width: 1.5;
            fill: none;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover .theme-icon {
            transform: rotate(15deg);
        }

        .icon-hidden {
            display: none;
        }

        /* === Main Content === */
        .main-content {
            max-width: 840px;
            margin: 2.5rem auto;
            padding: 0 1.25rem;
        }

        .content-card {
            background-color: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: 0 2px 10px var(--shadow);
            animation: fadeInUp 0.6s ease 0.4s both;
        }

        /* === Typography === */
        #content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        #content h2 {
            font-size: 1.875rem;
            font-weight: 600;
            margin-top: 3rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent);
        }

        #content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        #content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        #content p {
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        #content ul, #content ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        #content li {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        #content strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        #content em {
            font-style: italic;
        }

        #content a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        #content a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        #content code {
            background-color: var(--bg-tertiary);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.875em;
            color: var(--text-primary);
        }

        #content pre {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            line-height: 1.5;
        }

        #content pre code {
            background: none;
            padding: 0;
        }

        #content blockquote {
            background-color: var(--bg-tertiary);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        #content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }

        /* === Footer === */
        .site-footer {
            max-width: 840px;
            margin: 4rem auto 2rem;
            padding: 0 1.25rem;
        }

        .footer-divider {
            height: 1px;
            background-color: var(--border);
            margin-bottom: 2rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .footer-section h4 {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .footer-section p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .footer-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .footer-links a {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .footer-bottom p {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }

        /* === Loading State === */
        .loading-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-secondary);
        }

        .error-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-secondary);
        }

        /* === Animations === */
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === Responsive === */
        @media (max-width: 768px) {
            .site-title {
                font-size: 1.125rem;
            }

            .content-card {
                padding: 1.5rem;
            }

            #content h1 {
                font-size: 2rem;
            }

            #content h2 {
                font-size: 1.5rem;
            }

            #content h3 {
                font-size: 1.25rem;
            }

            .footer-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .header-container {
                padding: 0.875rem 1rem;
            }

            .main-content {
                margin: 1.5rem auto;
                padding: 0 1rem;
            }

            .content-card {
                padding: 1.25rem;
            }

            #content h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <h1 class="site-title">Consciousness Theory</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" type="button">
                <svg class="theme-icon sun-icon" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
                </svg>
                <svg class="theme-icon moon-icon icon-hidden" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="main-content">
        <article class="content-card">
            <div id="content" class="loading-state">Loading content...</div>
        </article>
    </main>

    <footer class="site-footer">
        <div class="footer-divider"></div>
        <div class="footer-grid">
            <div class="footer-section">
                <h4>About</h4>
                <p>A theory about consciousness, self-models, and the future of AI by bthavanish.</p>
            </div>
            <div class="footer-section">
                <h4>License</h4>
                <p>MIT License &copy; 2025 bthavanish</p>
            </div>
            <div class="footer-section">
                <h4>Resources</h4>
                <div class="footer-links">
                    <a href="#part-1-youre-being-reconstructed-every-moment">Read the Theory</a>
                    <a href="#testing-this-theory">Testing Framework</a>
                    <a href="https://github.com/bthavanish/consciousness-theory" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>bthavanish</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script>
        // Theme Management
        class ThemeManager {
            constructor() {
                this.html = document.documentElement;
                this.toggleBtn = document.getElementById('themeToggle');
                this.sunIcon = document.querySelector('.sun-icon');
                this.moonIcon = document.querySelector('.moon-icon');
                this.init();
            }

            init() {
                const savedTheme = this.getSavedTheme();
                this.applyTheme(savedTheme);
                this.toggleBtn.addEventListener('click', () => this.toggle());
            }

            getSavedTheme() {
                return localStorage.getItem('theme') || 'light';
            }

            applyTheme(theme) {
                const isDark = theme === 'dark';
                this.html.classList.toggle('dark', isDark);
                this.sunIcon.classList.toggle('icon-hidden', isDark);
                this.moonIcon.classList.toggle('icon-hidden', !isDark);
            }

            toggle() {
                const isDark = this.html.classList.contains('dark');
                const newTheme = isDark ? 'light' : 'dark';
                this.applyTheme(newTheme);
                localStorage.setItem('theme', newTheme);
            }
        }

        // Content Loader
        class ContentLoader {
            constructor() {
                this.contentEl = document.getElementById('content');
                this.url = 'https://raw.githubusercontent.com/bthavanish/consciousness-theory/refs/heads/paper-1/content.md';
            }

            async load() {
                try {
                    const response = await fetch(this.url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const markdown = await response.text();
                    this.render(markdown);
                } catch (error) {
                    this.showError(error);
                }
            }

            render(markdown) {
                marked.setOptions({
                    headerIds: true,
                    mangle: false,
                    breaks: false,
                    gfm: true
                });

                const html = marked.parse(markdown);
                this.contentEl.innerHTML = html;
                this.contentEl.classList.remove('loading-state');
            }

            showError(error) {
                console.error('Failed to load content:', error);
                this.contentEl.className = 'error-state';
                this.contentEl.innerHTML = `
                    <p>Unable to load content from GitHub.</p>
                    <p style="margin-top: 0.5rem;">Please check your connection and try again.</p>
                `;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            new ThemeManager();
            new ContentLoader().load();
        });
    </script>
</body>
</html>
