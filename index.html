<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="bthavanish's personal blog">
    <title>bthavanish's blog</title>
    <style>
        /* === CSS Variables === */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --bg-hover: #f5f5f5;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --accent: #cd7c53;
            --accent-hover: #b36a44;
            --accent-light: #f4ede8;
            --border: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.05);
            --shadow-lg: rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
        }

        html.dark {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #262626;
            --bg-hover: #2a2a2a;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --text-tertiary: #737373;
            --accent: #d4906f;
            --accent-hover: #e0a280;
            --accent-light: #2a2320;
            --border: #333333;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-lg: rgba(0, 0, 0, 0.5);
        }

        /* === Reset & Base === */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* === Header === */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            animation: slideDown 0.4s ease;
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: color 0.2s ease;
            animation: fadeIn 0.6s ease 0.2s both;
            user-select: none;
        }

        .site-title:hover {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.6s ease 0.3s both;
        }

        .icon-btn:hover {
            background-color: var(--bg-hover);
            border-color: var(--accent);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-primary);
            stroke-width: 1.5;
            fill: none;
        }

        .theme-toggle .icon-hidden {
            display: none;
        }

        /* === Home Screen === */
        .home-screen {
            min-height: calc(100vh - 140px);
            padding: 4rem 1.5rem;
        }

        .home-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .home-hero {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInUp 0.6s ease both;
        }

        .home-hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .home-hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        .document-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        .document-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .document-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .document-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px var(--shadow-lg);
            border-color: var(--accent);
        }

        .document-card:hover::before {
            transform: scaleX(1);
        }

        .document-icon {
            width: 48px;
            height: 48px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .document-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--accent);
            stroke-width: 2;
            fill: none;
        }

        .document-card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .document-card p {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            line-height: 1.6;
        }

        /* === Document View === */
        .document-view {
            display: none;
        }

        .document-view.active {
            display: block;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 1.5rem 0;
        }

        .back-button:hover {
            background-color: var(--bg-hover);
            border-color: var(--accent);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .page-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .content-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 3rem;
            align-items: start;
            margin: 2rem auto;
        }

        /* === Table of Contents === */
        .toc-sidebar {
            position: sticky;
            top: 100px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            scrollbar-width: none;
        }

        .toc-sidebar::-webkit-scrollbar {
            display: none;
        }

        .toc-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .toc-list {
            list-style: none;
        }

        .toc-list li {
            margin-bottom: 0.5rem;
        }

        .toc-list a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            display: block;
            padding: 0.25rem 0;
            line-height: 1.4;
        }

        .toc-list a:hover {
            color: var(--accent);
            padding-left: 0.5rem;
        }

        .toc-list a.active {
            color: var(--accent);
            font-weight: 500;
            padding-left: 0.5rem;
            border-left: 2px solid var(--accent);
        }

        .toc-h3 {
            padding-left: 1rem;
            font-size: 0.8125rem;
        }

        /* === Mobile TOC === */
        .toc-mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toc-mobile-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .toc-mobile-panel {
            position: fixed;
            top: 0;
            left: -100%;
            width: 280px;
            height: 100vh;
            background-color: var(--bg-primary);
            z-index: 1000;
            overflow-y: auto;
            transition: left 0.3s ease;
            box-shadow: 2px 0 10px var(--shadow-lg);
        }

        .toc-mobile-panel.active {
            left: 0;
        }

        .toc-mobile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            z-index: 1;
        }

        .toc-mobile-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }

        .toc-mobile-close:hover {
            color: var(--text-primary);
        }

        .toc-mobile-close svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .toc-mobile-content {
            padding: 1.25rem;
        }

        /* === Content === */
        .content-wrapper {
            min-width: 0;
        }

        .content-card {
            background-color: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        /* === Typography === */
        #content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        #content h2 {
            font-size: 1.875rem;
            font-weight: 600;
            margin-top: 3rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent);
        }

        #content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        #content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        #content p {
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        #content ul, #content ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        #content li {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        #content strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        #content a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        #content a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        #content code {
            background-color: var(--bg-tertiary);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.875em;
            color: var(--text-primary);
        }

        #content pre {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            line-height: 1.5;
        }

        #content pre code {
            background: none;
            padding: 0;
        }

        #content blockquote {
            background-color: var(--bg-tertiary);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        #content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }

        /* === Reading Progress === */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-hover) 100%);
            z-index: 101;
            transition: width 0.1s ease;
        }

        /* === Scroll to Top === */
        .scroll-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            background-color: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 99;
            box-shadow: 0 4px 12px var(--shadow-lg);
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top:hover {
            background-color: var(--accent-hover);
            transform: translateY(-4px);
        }

        .scroll-top svg {
            width: 24px;
            height: 24px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        /* === Reading Time === */
        .reading-time {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            padding: 0.5rem 0;
        }

        .reading-time svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }

        /* === Loading State === */
        .loading-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-secondary);
        }

        /* === Animations === */
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === Text Size Controls === */
        .text-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            animation: fadeIn 0.6s ease 0.4s both;
        }

        .text-size-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .text-size-btn:hover {
            background-color: var(--bg-hover);
            border-color: var(--accent);
        }

        /* === Responsive === */
        @media (max-width: 1024px) {
            .content-layout {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .toc-sidebar {
                display: none !important;
            }

            .toc-mobile-overlay {
                display: block;
            }

            .toc-mobile-toggle {
                display: flex !important;
            }
        }

        @media (min-width: 1025px) {
            .toc-mobile-toggle {
                display: none !important;
            }
        }

        @media (max-width: 768px) {
            .home-hero h1 {
                font-size: 2.25rem;
            }

            .home-hero p {
                font-size: 1.125rem;
            }

            .document-grid {
                grid-template-columns: 1fr;
            }

            .content-card {
                padding: 1.5rem;
            }

            #content h1 {
                font-size: 2rem;
            }

            #content h2 {
                font-size: 1.5rem;
            }

            .text-controls {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .home-hero h1 {
                font-size: 1.875rem;
            }

            .header-container {
                padding: 1rem;
            }

            .home-screen {
                padding: 2rem 1rem;
            }
        }

        @media print {
            .site-header, .scroll-top, .toc-sidebar, .toc-mobile-panel, .toc-mobile-overlay, .back-button {
                display: none !important;
            }

            .content-layout {
                display: block;
            }

            .content-card {
                border: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="reading-progress" id="readingProgress"></div>
    
    <header class="site-header">
        <div class="header-container">
            <h1 class="site-title" id="siteTitle">bthavanish's blog</h1>
            <div class="header-actions">
                <button class="icon-btn toc-mobile-toggle" id="tocMobileToggle" aria-label="Toggle table of contents" type="button" style="display: none;">
                    <svg viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                    </svg>
                </button>
                <button class="icon-btn print-btn" id="printBtn" aria-label="Print document" type="button" style="display: none;">
                    <svg viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0110.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 2.523a1.125 1.125 0 01-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0021 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 00-1.913-.247M6.34 18H5.25A2.25 2.25 0 013 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 011.913-.247m10.5 0a48.536 48.536 0 00-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5zm-3 0h.008v.008H15V10.5z"/>
                    </svg>
                </button>
                <div class="text-controls">
                    <button class="text-size-btn" id="decreaseText" aria-label="Decrease text size" type="button">A−</button>
                    <button class="text-size-btn" id="resetText" aria-label="Reset text size" type="button">A</button>
                    <button class="text-size-btn" id="increaseText" aria-label="Increase text size" type="button">A+</button>
                </div>
                <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle theme" type="button">
                    <svg class="sun-icon" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
                    </svg>
                    <svg class="moon-icon icon-hidden" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile TOC Overlay -->
    <div class="toc-mobile-overlay" id="tocMobileOverlay"></div>
    
    <!-- Mobile TOC Panel -->
    <aside class="toc-mobile-panel" id="tocMobilePanel">
        <div class="toc-mobile-header">
            <h3 class="toc-title">Table of Contents</h3>
            <button class="toc-mobile-close" id="tocMobileClose" aria-label="Close table of contents" type="button">
                <svg viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="toc-mobile-content" id="tocMobileContent"></div>
    </aside>

    <!-- Home Screen -->
    <div class="home-screen" id="homeScreen">
        <div class="home-container">
            <div class="home-hero">
                <h1>Select a blog to open</h1>
                <p>more will be added in the future..</p>
            </div>
            <div class="document-grid" id="documentGrid"></div>
        </div>
    </div>

    <!-- Document View -->
    <div class="document-view" id="documentView">
        <div class="page-container">
            <button class="back-button" id="backButton" type="button">
                <svg viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                </svg>
                Back to Library
            </button>
            
            <div class="content-layout">
                <!-- Desktop TOC Sidebar -->
                <aside class="toc-sidebar" id="tocSidebar">
                    <div class="toc-header">
                        <h3 class="toc-title">Table of Contents</h3>
                    </div>
                    <nav id="tocDesktopContent"></nav>
                </aside>

                <!-- Main Content -->
                <div class="content-wrapper">
                    <article class="content-card">
                        <div id="content" class="loading-state">
                            <div class="loading-spinner"></div>
                            <p>Hang tight, loading your content...</p>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </div>

    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top" type="button">
        <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/>
        </svg>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script>
        // === DOCUMENT CONFIGURATION ===
        const DOCUMENTS = [
            {
                title: "Consciousness Theory",
                description: "A theory about consciousness, self-models, and the future of AI",
                url: "https://raw.githubusercontent.com/bthavanish/bthavanish-blog/refs/heads/blog/content/consciousness-theory.md"
            }
           /* {
                title: "Example Document",
                description: "Add more documents here by editing the DOCUMENTS array",
                url: "https://raw.githubusercontent.com/example/repo/main/document.md"
            }*/
            // Add more documents here following the same structure
        ];

        // === STATE MANAGEMENT ===
        class AppState {
            constructor() {
                this.currentDocument = null;
                this.view = 'home'; // 'home' or 'document'
            }

            setDocument(doc) {
                this.currentDocument = doc;
                this.view = 'document';
                this.updateUI();
            }

            setHome() {
                this.currentDocument = null;
                this.view = 'home';
                this.updateUI();
            }

            updateUI() {
                const homeScreen = document.getElementById('homeScreen');
                const documentView = document.getElementById('documentView');
                const tocToggle = document.getElementById('tocMobileToggle');
                const printBtn = document.getElementById('printBtn');
                
                if (this.view === 'home') {
                    homeScreen.style.display = 'block';
                    documentView.classList.remove('active');
                    tocToggle.style.display = 'none';
                    printBtn.style.display = 'none';
                    document.getElementById('readingProgress').style.display = 'none';
                } else {
                    homeScreen.style.display = 'none';
                    documentView.classList.add('active');
                    tocToggle.style.display = 'flex';
                    printBtn.style.display = 'flex';
                    document.getElementById('readingProgress').style.display = 'block';
                }
            }
        }

        const appState = new AppState();

        // === THEME MANAGEMENT ===
        class ThemeManager {
            constructor() {
                this.html = document.documentElement;
                this.toggleBtn = document.getElementById('themeToggle');
                this.sunIcon = document.querySelector('.sun-icon');
                this.moonIcon = document.querySelector('.moon-icon');
                this.init();
            }

            init() {
                const savedTheme = this.getSavedTheme();
                this.applyTheme(savedTheme);
                this.toggleBtn.addEventListener('click', () => this.toggle());
            }

            getSavedTheme() {
                return localStorage.getItem('theme') || 'light';
            }

            applyTheme(theme) {
                const isDark = theme === 'dark';
                this.html.classList.toggle('dark', isDark);
                this.sunIcon.classList.toggle('icon-hidden', isDark);
                this.moonIcon.classList.toggle('icon-hidden', !isDark);
            }

            toggle() {
                const isDark = this.html.classList.contains('dark');
                const newTheme = isDark ? 'light' : 'dark';
                this.applyTheme(newTheme);
                localStorage.setItem('theme', newTheme);
            }
        }

        // === TEXT SIZE CONTROL ===
        class TextSizeControl {
            constructor() {
                this.contentEl = document.getElementById('content');
                this.sizes = [14, 16, 18, 20];
                this.currentIndex = 1;
                
                document.getElementById('decreaseText').addEventListener('click', () => this.decrease());
                document.getElementById('increaseText').addEventListener('click', () => this.increase());
                document.getElementById('resetText').addEventListener('click', () => this.reset());
                
                this.loadSavedSize();
            }

            loadSavedSize() {
                const saved = localStorage.getItem('textSize');
                if (saved) {
                    const index = this.sizes.indexOf(parseInt(saved));
                    if (index !== -1) {
                        this.currentIndex = index;
                        this.apply();
                    }
                }
            }

            decrease() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.apply();
                }
            }

            increase() {
                if (this.currentIndex < this.sizes.length - 1) {
                    this.currentIndex++;
                    this.apply();
                }
            }

            reset() {
                this.currentIndex = 1;
                this.apply();
            }

            apply() {
                const size = this.sizes[this.currentIndex];
                this.contentEl.style.fontSize = `${size}px`;
                localStorage.setItem('textSize', size);
            }
        }

        // === TABLE OF CONTENTS ===
        class TableOfContents {
            constructor() {
                this.desktopContainer = document.getElementById('tocDesktopContent');
                this.mobileContainer = document.getElementById('tocMobileContent');
                this.mobileToggle = document.getElementById('tocMobileToggle');
                this.mobileOverlay = document.getElementById('tocMobileOverlay');
                this.mobilePanel = document.getElementById('tocMobilePanel');
                this.mobileClose = document.getElementById('tocMobileClose');
                this.headings = [];
                this.initMobileHandlers();
            }

            initMobileHandlers() {
                this.mobileToggle.addEventListener('click', () => this.openMobile());
                this.mobileClose.addEventListener('click', () => this.closeMobile());
                this.mobileOverlay.addEventListener('click', () => this.closeMobile());
            }

            openMobile() {
                this.mobileOverlay.classList.add('active');
                this.mobilePanel.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            closeMobile() {
                this.mobileOverlay.classList.remove('active');
                this.mobilePanel.classList.remove('active');
                document.body.style.overflow = '';
            }

            generate() {
                const contentEl = document.getElementById('content');
                this.headings = Array.from(contentEl.querySelectorAll('h2, h3'));
                
                if (this.headings.length === 0) {
                    document.getElementById('tocSidebar').style.display = 'none';
                    return;
                }

                document.getElementById('tocSidebar').style.display = 'block';
                const list = this.createTOCList();
                
                this.desktopContainer.innerHTML = '';
                this.mobileContainer.innerHTML = '';
                this.desktopContainer.appendChild(list.cloneNode(true));
                this.mobileContainer.appendChild(list.cloneNode(true));

                this.initActiveTracking();
                this.initClickHandlers();
            }

            createTOCList() {
                const list = document.createElement('ul');
                list.className = 'toc-list';
                
                this.headings.forEach((heading, index) => {
                    const id = heading.id || `heading-${index}`;
                    heading.id = id;
                    
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `#${id}`;
                    a.textContent = heading.textContent;
                    a.className = heading.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
                    a.dataset.id = id;
                    
                    li.appendChild(a);
                    list.appendChild(li);
                });

                return list;
            }

            initClickHandlers() {
                const links = document.querySelectorAll('.toc-list a');
                links.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const targetId = link.getAttribute('href').slice(1);
                        const target = document.getElementById(targetId);
                        if (target) {
                            // Close mobile menu first
                            this.closeMobile();
                            // Small delay to ensure menu closes before scrolling
                            setTimeout(() => {
                                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }, 100);
                        }
                    });
                });
            }

            initActiveTracking() {
                const links = document.querySelectorAll('.toc-list a');
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            links.forEach(link => link.classList.remove('active'));
                            const activeLinks = document.querySelectorAll(`a[data-id="${entry.target.id}"]`);
                            activeLinks.forEach(link => link.classList.add('active'));
                        }
                    });
                }, { 
                    rootMargin: '-100px 0px -66%',
                    threshold: 0
                });

                this.headings.forEach(heading => observer.observe(heading));
            }
        }

        // === READING PROGRESS ===
        class ReadingProgress {
            constructor() {
                this.bar = document.getElementById('readingProgress');
                this.init();
            }

            init() {
                window.addEventListener('scroll', () => this.update());
                this.update();
            }

            update() {
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const scrollPercent = (scrollTop / (documentHeight - windowHeight)) * 100;
                
                this.bar.style.width = `${Math.min(scrollPercent, 100)}%`;
            }
        }

        // === SCROLL TO TOP ===
        class ScrollToTop {
            constructor() {
                this.btn = document.getElementById('scrollTop');
                this.init();
            }

            init() {
                window.addEventListener('scroll', () => this.toggle());
                this.btn.addEventListener('click', () => this.scrollToTop());
            }

            toggle() {
                if (window.pageYOffset > 300) {
                    this.btn.classList.add('visible');
                } else {
                    this.btn.classList.remove('visible');
                }
            }

            scrollToTop() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // === READING TIME ESTIMATOR ===
        class ReadingTime {
            constructor() {
                this.wordsPerMinute = 200;
            }

            calculate(text) {
                const words = text.trim().split(/\s+/).length;
                const minutes = Math.ceil(words / this.wordsPerMinute);
                return minutes;
            }

            display(minutes) {
                const contentEl = document.getElementById('content');
                const firstHeading = contentEl.querySelector('h1, h2');
                
                if (firstHeading) {
                    const readingTime = document.createElement('div');
                    readingTime.className = 'reading-time';
                    readingTime.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>${minutes} min read</span>
                    `;
                    firstHeading.insertAdjacentElement('afterend', readingTime);
                }
            }
        }

        // === PRINT MANAGER ===
        class PrintManager {
            constructor() {
                document.getElementById('printBtn').addEventListener('click', () => this.print());
            }

            print() {
                window.print();
            }
        }

        // === DOCUMENT LOADER ===
        class DocumentLoader {
            constructor() {
                this.contentEl = document.getElementById('content');
            }

            async load(url) {
                try {
                    this.contentEl.className = 'loading-state';
                    this.contentEl.innerHTML = '<div class="loading-spinner"></div><p>Hang tight, loading your content...</p>';
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const markdown = await response.text();
                    this.render(markdown);
                    this.initEnhancements(markdown);
                } catch (error) {
                    this.showError(error);
                }
            }

            render(markdown) {
                marked.setOptions({
                    headerIds: true,
                    mangle: false,
                    breaks: false,
                    gfm: true
                });

                const html = marked.parse(markdown);
                this.contentEl.innerHTML = html;
                this.contentEl.classList.remove('loading-state');
            }

            initEnhancements(markdown) {
                const toc = new TableOfContents();
                toc.generate();

                const readingTime = new ReadingTime();
                const minutes = readingTime.calculate(markdown);
                readingTime.display(minutes);

                window.scrollTo({ top: 0 });
            }

            showError(error) {
                console.error('Failed to load content:', error);
                this.contentEl.className = 'error-state';
                this.contentEl.innerHTML = `
                    <p>Oops! This is akward..</p>
                    <p style="margin-top: 0.5rem;">Check your internet connection and give it another shot!</p>
                `;
            }
        }

        // === HOME SCREEN MANAGER ===
        class HomeScreenManager {
            constructor() {
                this.gridEl = document.getElementById('documentGrid');
                this.loader = new DocumentLoader();
            }

            init() {
                this.renderDocuments();
            }

            renderDocuments() {
                this.gridEl.innerHTML = '';
                
                DOCUMENTS.forEach((doc, index) => {
                    const card = document.createElement('div');
                    card.className = 'document-card';
                    card.innerHTML = `
                        <div class="document-icon">
                            <svg viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
                            </svg>
                        </div>
                        <h3>${doc.title}</h3>
                        <p>${doc.description}</p>
                    `;
                    
                    card.addEventListener('click', () => this.openDocument(doc));
                    this.gridEl.appendChild(card);
                });
            }

            openDocument(doc) {
                appState.setDocument(doc);
                this.loader.load(doc.url);
            }
        }

        // === INITIALIZATION ===
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize theme first
            new ThemeManager();
            
            // Initialize utilities
            new ReadingProgress();
            new ScrollToTop();
            new PrintManager();
            new TextSizeControl();
            
            // Initialize home screen
            const homeManager = new HomeScreenManager();
            homeManager.init();
            
            // Initialize navigation
            document.getElementById('siteTitle').addEventListener('click', () => {
                appState.setHome();
            });
            
            document.getElementById('backButton').addEventListener('click', () => {
                appState.setHome();
            });
            
            // Set initial view
            appState.setHome();
        });
    </script>
</body>
</html>
