<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect handler
        (function() {
            // Just redirect everything to index.html with the same path
            // The router in script.js will handle everything
            var l = window.location;
            
            // Store the redirect info
            sessionStorage.redirect = l.href;
            
            // Redirect to index.html - it will handle the rest
            l.replace('/blog/');
        })();
    </script>
</head>
<body>
    <noscript>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 2rem;
                text-align: center;
            }
            .error {
                max-width: 500px;
            }
            h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
                color: #cd7c53;
            }
            p {
                color: #666;
                margin-bottom: 1.5rem;
            }
            a {
                display: inline-block;
                padding: 0.75rem 1.5rem;
                background: #cd7c53;
                color: white;
                text-decoration: none;
                border-radius: 8px;
            }
        </style>
        <div class="error">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>JavaScript is required to view this site.</p>
            <a href="/blog/">Go Home</a>
        </div>
    </noscript>
</body>
</html>
