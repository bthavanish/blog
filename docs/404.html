<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Single Page Apps for GitHub Pages
        // This script converts 404 paths into query strings that index.html can handle
        (function(l) {
            var path = l.pathname.slice(0, -1);
            if (path && path !== '/blog') {
                var search = l.search.slice(1);
                // Encode the path and search into query format
                l.replace(
                    '/blog/?/' + 
                    path.replace('/blog/', '') + 
                    (search ? '&' + search.replace(/&/g, '~and~') : '') +
                    l.hash
                );
            }
        }(window.location));
    </script>
</head>
<body>
    <noscript>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 2rem;
                text-align: center;
            }
            .error {
                max-width: 500px;
            }
            h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
                color: #cd7c53;
            }
            p {
                color: #666;
                margin-bottom: 1.5rem;
            }
            a {
                display: inline-block;
                padding: 0.75rem 1.5rem;
                background: #cd7c53;
                color: white;
                text-decoration: none;
                border-radius: 8px;
            }
        </style>
        <div class="error">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>JavaScript is required to view this site.</p>
            <a href="/blog/">Go Home</a>
        </div>
    </noscript>
</body>
</html>
