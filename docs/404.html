<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect handler
        (function() {
            var l = window.location;
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            
            // Check if this is a Giscus OAuth callback
            if (l.search) {
                var search = l.search.substring(1);
                var isGiscusCallback = search.indexOf('code=') !== -1 && search.indexOf('state=') !== -1;
                
                if (isGiscusCallback) {
                    // For Giscus OAuth, redirect to the page stored in the 'state' parameter
                    var stateParam = search.split('&').find(function(param) {
                        return param.indexOf('state=') === 0;
                    });
                    
                    if (stateParam) {
                        try {
                            var stateValue = decodeURIComponent(stateParam.split('=')[1]);
                            var stateData = JSON.parse(stateValue);
                            
                            // Redirect to the original page with all OAuth params
                            if (stateData && stateData.url) {
                                l.replace(stateData.url + '?' + search);
                                return;
                            }
                        } catch (e) {
                            // If we can't parse state, just go to home with params
                        }
                    }
                    
                    // Fallback: redirect to home with OAuth params
                    l.replace('/blog/?' + search);
                    return;
                }
            }
            
            // Handle normal SPA redirects
            if (redirect && redirect !== l.href) {
                history.replaceState(null, null, redirect);
            }
        })();
    </script>
</head>
<body>
    <noscript>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 2rem;
                text-align: center;
            }
            .error {
                max-width: 500px;
            }
            h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
                color: #cd7c53;
            }
            p {
                color: #666;
                margin-bottom: 1.5rem;
            }
            a {
                display: inline-block;
                padding: 0.75rem 1.5rem;
                background: #cd7c53;
                color: white;
                text-decoration: none;
                border-radius: 8px;
            }
        </style>
        <div class="error">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>JavaScript is required to view this site.</p>
            <a href="/blog/">Go Home</a>
        </div>
    </noscript>
</body>
</html>
