<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="bthavanish's personal blog">
    <title>bthavanish's blog</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="src/css/theme.css">
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components.css">
    
    <!-- GitHub Pages SPA support -->
    <script>
        (function(l) {
            if (l.search) {
                var params = {};
                l.search.slice(1).split('&').forEach(function(v) {
                    var pair = v.split('=');
                    params[pair[0]] = pair.slice(1).join('=');
                });
                if (params.p !== undefined) {
                    var path = decodeURIComponent(params.p);
                    var query = params.q ? decodeURIComponent(params.q) : '';
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + path +
                        (query ? '?' + query : '') + l.hash
                    );
                }
            }
        }(window.location));
    </script>
</head>
<body>
    <!-- Reading Progress Bar -->
    <div class="reading-progress" id="readingProgress" style="display: none;"></div>
    
    <!-- Header -->
    <header class="site-header" id="siteHeader">
        <div class="header-container">
            <div class="header-left">
                <button class="logo-btn" id="logoBtn">
                    <svg class="logo-icon" id="logoIcon" viewBox="0 0 24 24">
                       <!--<path d="M12 2L2 7L12 12L22 7L12 2Z" />
                        <path d="M2 17L12 22L22 17" />
                        <path d="M2 12L12 17L22 12" />-->
                    </svg>
                    <span class="logo-text" id="siteTitle">Loading...</span>
                </button>
            </div>
            
            <nav class="header-nav">
                <button class="icon-btn" id="searchBtn" aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                </button>
                
                <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
                    <svg class="theme-icon sun-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="theme-icon moon-icon hidden" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                
                <button class="icon-btn mobile-toc-btn" id="mobileTocBtn" aria-label="Table of contents" style="display: none;">
                    <svg viewBox="0 0 24 24">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- Search Modal -->
    <div class="modal-overlay" id="searchOverlay">
        <div class="search-modal">
            <div class="search-header">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search articles..."
                    autocomplete="off"
                >
                <button class="icon-btn" id="searchClose" aria-label="Close">
                    <svg viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Home View -->
        <div class="view home-view active" id="homeView">
            <div class="container">
                <section class="hero">
                    <h1 class="hero-title" id="heroTitle">Loading...</h1>
                    <p class="hero-subtitle" id="heroSubtitle">Loading...</p>
                </section>

                <section class="posts-section">
                    <div class="posts-grid" id="postsGrid">
                        <!-- Posts will be inserted here -->
                    </div>
                </section>
            </div>
        </div>

        <!-- Post View -->
        <div class="view post-view" id="postView">
            <div class="container">
                <button class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    <span>Back</span>
                </button>

                <div class="post-layout">
                    <!-- Desktop TOC Sidebar -->
                    <aside class="toc-sidebar desktop-only" id="tocSidebar" style="display: none;">
                        <div class="toc-sticky">
                            <h3 class="toc-title">Contents</h3>
                            <nav class="toc-nav" id="tocNav"></nav>
                        </div>
                    </aside>

                    <!-- Main Content -->
                    <article class="post-content">
                        <div id="postContent" class="content-area">
                            <div class="loading-state">
                                <div class="spinner"></div>
                                <p>Loading content...</p>
                            </div>
                        </div>

                        <!-- Comments -->
                        <div class="comments-section" id="commentsSection" style="display: none;">
                            <h2 class="comments-title">Comments</h2>
                            <div id="commentsContainer"></div>
                        </div>
                    </article>

                    <!-- Post Actions Sidebar -->
                    <aside class="actions-sidebar desktop-only" id="actionsSidebar">
                        <div class="actions-sticky">
                            <button class="action-btn" id="shareBtn" aria-label="Share" title="Share">
                                <svg viewBox="0 0 24 24">
                                    <circle cx="18" cy="5" r="3"/>
                                    <circle cx="6" cy="12" r="3"/>
                                    <circle cx="18" cy="19" r="3"/>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                                </svg>
                            </button>
                            <button class="action-btn" id="printBtn" aria-label="Print" title="Print">
                                <svg viewBox="0 0 24 24">
                                    <polyline points="6 9 6 2 18 2 18 9"/>
                                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                                    <rect x="6" y="14" width="12" height="8"/>
                                </svg>
                            </button>
                            <div class="text-size-controls">
                                <button class="text-size-btn" id="textSizeIncrease" aria-label="Increase text size" title="Increase text size">
                                    A+
                                </button>
                                <button class="text-size-btn" id="textSizeReset" aria-label="Reset text size" title="Reset text size">
                                    A
                                </button>
                                <button class="text-size-btn" id="textSizeDecrease" aria-label="Decrease text size" title="Decrease text size">
                                    A-
                                </button>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>

        <!-- 404 View -->
        <div class="view error-view" id="errorView">
            <div class="error-container">
                <div class="error-icon">404</div>
                <h1 class="error-title">Page Not Found</h1>
                <p class="error-text">The article you're looking for doesn't exist or may have been moved.</p>
                <button class="primary-btn" id="errorHomeBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Go Home</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" id="siteFooter">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text" id="footerText">Loading...</p>
                <div class="footer-links" id="footerLinks"></div>
            </div>
        </div>
    </footer>

    <!-- Scroll to Top -->
    <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to top">
        <svg viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
        </svg>
    </button>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Mobile TOC Panel -->
    <div class="mobile-panel-overlay" id="tocOverlay"></div>
    <div class="mobile-panel" id="tocPanel">
        <div class="panel-header">
            <h3>Contents</h3>
            <button class="icon-btn" id="tocClose">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <nav class="panel-content" id="tocMobileNav"></nav>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="src/js/storage.js"></script>
    <script src="src/js/theme.js"></script>
    <script src="src/js/markdown.js"></script>
    <script src="src/js/ui.js"></script>
    <script src="src/js/router.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
